services:
  - type: web
    name: iepa-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn iepa.backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: "true"
